name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tamurt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tamurt?schema=public
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      OTP_PEPPER: ci-only-otp-pepper-0123456789
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit des dépendances
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Bases de test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE tamurt_test;" -c "CREATE DATABASE tamurt_e2e;"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/tamurt_test?schema=public pnpm db:deploy
          cp .env.test.example .env.test
      - name: Tests unitaires et d'intégration
        run: pnpm test
      - name: Build de production
        run: pnpm build
      - name: Tests end-to-end
        run: |
          npx playwright install --with-deps chromium
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/tamurt_e2e?schema=public pnpm db:deploy
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: /tmp/tamurt-e2e
